name: 🐍 Cyber Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Generate Cyber Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ayushk373
          outputs: |
               dist/cyber-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#09090b,#164e63,#0891b2,#06b6d4,#67e8f9
               dist/cyber-snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#f8fafc,#dbeafe,#93c5fd,#3b82f6,#1d4ed8
      - name: 🚀 Deploy Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
